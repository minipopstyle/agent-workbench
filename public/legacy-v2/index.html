<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trajectory V2</title>
<style>
:root{color-scheme:light;--bg:#fff;--paper:#fff;--ink:#1d2230;--muted:#687087;--line:#e3e7ee;--grid:#e9edf4;--blue:#2b64eb;--blue-soft:#e9f0ff;--blue-light:#79b8f3;--red:#ee3f46;--green:#22a060;--orange:#f39a2b;--violet:#7659d9;--cyan:#52b6c8;--soft:#f7f9fc;--focus:#dbe7ff}
body[data-theme=dark]{color-scheme:dark;--bg:#0b1020;--paper:#10182a;--ink:#eef3fb;--muted:#96a1b5;--line:#27344a;--grid:#1d2a40;--blue:#6b9cff;--blue-soft:#17325e;--blue-light:#77bdf4;--red:#ff686f;--green:#56c887;--orange:#ffb04b;--violet:#a58cff;--cyan:#6dd1e0;--soft:#111d31;--focus:#173b75}
*{box-sizing:border-box}html,body{min-width:0;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,summary{font:inherit;color:inherit}button,input,select{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}button{padding:0 10px;cursor:pointer}button:hover,summary:hover{border-color:#b8c1d0}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.top{position:sticky;top:0;z-index:5;background:var(--paper)}.toolbar{height:51px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);gap:14px;white-space:nowrap}.brand{font-size:16px;font-weight:700;letter-spacing:-.15px}.brand i{padding:0 5px;font-style:normal;font-weight:400;color:var(--muted)}.spacer{flex:1}.controls{display:flex;align-items:center;gap:8px}.control-group{height:30px;display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--paper);overflow:hidden}.control-group button{height:28px;min-width:28px;padding:0 7px;border:0;border-radius:0}.control-group output{min-width:48px;text-align:center;color:var(--muted)}.play{display:inline-flex;align-items:center;gap:6px}.play:before{content:"";width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor}.play.playing:before{width:8px;height:10px;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor}.speed{width:58px;padding:0 6px}.clock{min-width:105px;justify-content:center;color:var(--muted)}.search{width:235px;padding:0 10px 0 30px}.search-wrap{position:relative}.search-wrap:before{content:"";position:absolute;left:10px;top:8px;width:9px;height:9px;border:1px solid var(--muted);border-radius:50%;z-index:1}.search-wrap:after{content:"";position:absolute;left:19px;top:18px;width:5px;border-top:1px solid var(--muted);transform:rotate(45deg);z-index:1}.toolbar-filter{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--muted);font-size:11px}.toolbar-filter input{width:14px;height:14px;margin:0;accent-color:var(--red)}.toolbar-category{width:126px;padding:0 7px;color:var(--muted);font-size:11px}.sr-range{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.meta{height:40px;display:flex;align-items:center;gap:32px;padding:0 24px;border-bottom:1px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden}.meta b{color:var(--ink);font-weight:500}.meta .badge{padding:2px 6px;border-radius:4px;font-size:10px}.badge-complete{color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}.badge-answer{color:var(--blue);background:var(--blue-soft)}.empty{padding:80px;text-align:center;color:var(--muted)}.shell{width:100%;min-width:0}.atlas-wrap{position:relative;height:558px;overflow:hidden}#atlas{display:block;width:100%;height:558px;touch-action:none;user-select:none;-webkit-user-select:none}.region-marker{position:absolute;left:0;width:100%;pointer-events:none}.grid-line{stroke:var(--grid);stroke-width:1}.lane-line{stroke:var(--line);stroke-width:1}.tick{fill:var(--muted);font-size:10px}.tick-strong{fill:var(--ink);font-size:10px}.band{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--muted);font-size:10px}.main{fill:none;stroke:var(--blue);stroke-width:2}.fail{fill:none;stroke:var(--red);stroke-width:1.5;stroke-dasharray:4 3}.recover{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:3 3}.skip{fill:none;stroke:#9098a8;stroke-width:1.2;stroke-dasharray:2 3}.node{stroke:none;cursor:pointer}.tool{cursor:pointer}.hot{filter:drop-shadow(0 0 3px var(--blue));stroke:var(--ink)!important;stroke-width:2.5!important}.cursor{stroke:var(--blue);stroke-width:1.25}.cursor-handle{fill:var(--blue)}.cursor-label{fill:var(--blue)}.cursor-label-text{fill:#fff;font-size:10px;font-weight:650}.brush{fill:var(--focus);opacity:.38}.threshold{stroke:#a8afbc;stroke-dasharray:4 4}.danger{stroke:var(--red)}.context{fill:none;stroke:var(--blue);stroke-width:1.8}.context-fill{fill:var(--blue);opacity:.1}
.findings{height:121px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.finding{position:relative;display:grid;grid-template-columns:32px 1fr;gap:8px;padding:20px 28px 12px 25px;border-right:1px solid var(--line)}.finding:last-child{border-right:0}.finding:before{content:attr(data-index);width:25px;height:25px;display:grid;place-items:center;border:1.5px solid var(--finding-color,var(--blue));border-radius:50%;color:var(--finding-color,var(--blue));font-size:10px}.finding b{display:block;margin-bottom:6px;font-size:13px}.finding span{display:block;color:var(--muted);font-size:11px;line-height:1.45}.finding em{display:block;margin-top:8px;color:var(--ink);font-style:normal;font-weight:600;font-size:11px}
.bottom{height:234px;display:grid;grid-template-columns:1fr 1fr}.analysis{min-width:0;padding:11px 24px 8px;border-right:1px solid var(--line);overflow:hidden}.analysis:last-child{border-right:0}.analysis h2{margin:0;font-size:14px;font-weight:650}.analysis h2 small{color:var(--muted);font-size:10px;font-weight:450}#beeswarm{height:192px}#beeswarm svg{width:100%;height:100%;display:block}.matrix{display:grid;grid-template-columns:minmax(155px,1.55fr) repeat(4,minmax(64px,.72fr)) minmax(120px,1.15fr);margin-top:8px;border-top:1px solid var(--line);overflow:hidden}.matrix>div{min-height:25px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);font-size:10px}.mhead{color:var(--muted);font-weight:600}.mlabel{color:var(--ink)}.metric{justify-content:flex-start;font-variant-numeric:tabular-nums}.rate{gap:8px}.rate-bar{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}.rate-bar i{display:block;height:100%;background:var(--green)}.below{min-width:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.section{min-width:0;padding:16px 24px;border-right:1px solid var(--line)}.section:last-child{border-right:0}.section h2{margin:0 0 10px;font-size:14px}.failure{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.number{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--red);color:#fff;font-size:10px}.badge{font-size:10px;border:1px solid var(--line);padding:2px 5px;border-radius:99px;color:var(--muted)}.good{color:var(--green);border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.detail{position:fixed;z-index:8;right:18px;bottom:18px;width:min(520px,calc(100vw - 36px));max-height:62vh;overflow:auto;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;box-shadow:0 12px 40px #0004}.detail header{display:flex;align-items:center;gap:8px}.detail h3{margin:0}.detail header button{margin-left:auto}.detail pre{padding:9px;white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:5px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.play-mask{fill:var(--paper);opacity:.72;pointer-events:none}.hover-hit,.context-point,.agent-node,.node-hit,.tool-hit,.fail-hit{cursor:pointer}.node-hit:focus,.tool-hit:focus,.fail-hit:focus,.agent-node:focus{stroke:var(--blue);stroke-width:2}.agent-link{stroke-dasharray:5 8;stroke-linecap:round;opacity:.55;animation:agent-flow 1.4s linear infinite}.agent-root-label{fill:#fff;font-size:11px;font-weight:700}.agent-root-meta{fill:#fff;font-size:8px;opacity:.82}.agent-node-title{fill:var(--ink);font-size:10px;font-weight:650}.agent-meta{fill:var(--muted);font-size:9px}@keyframes agent-flow{to{stroke-dashoffset:-26}}.section-title{display:flex;align-items:center;gap:10px}.section-title h2{margin-right:auto}.section-title .control-group{height:24px}.section-title .control-group button{height:22px;min-width:24px}.section-title .control-group output{min-width:44px;font-size:10px}#failPanel[hidden]+#agentPanel{grid-column:1/-1}#agents{width:100%;height:310px;overflow:auto;overscroll-behavior:contain}#agents svg{display:block;max-width:none}.failure-toggle{height:26px;color:var(--blue);background:transparent}.detail{top:91px;right:0;bottom:0;width:min(520px,calc(100vw - 24px));max-height:none;border-radius:0;border-right:0;border-bottom:0}.tooltip{position:fixed;z-index:10;width:min(360px,calc(100vw - 24px));padding:10px 12px;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px #0003}.tooltip b,.tooltip span,.tooltip small{display:block}.tooltip span{margin-top:4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tooltip small{margin-top:5px;color:var(--muted)}.node{stroke:var(--paper);stroke-width:1.5}
@media(max-width:1100px){.toolbar{padding:0 14px;overflow-x:auto}.meta{padding:0 14px;gap:20px;overflow-x:auto}.bottom{height:auto;grid-template-columns:1fr}.analysis{min-height:234px;border-right:0;border-bottom:1px solid var(--line)}.below{grid-template-columns:1fr}}
@media(max-width:760px){.brand{position:sticky;left:14px;background:var(--paper);padding-right:12px;z-index:2}.findings{height:auto;grid-template-columns:1fr}.finding{border-right:0;border-bottom:1px solid var(--line)}.matrix{min-width:680px}.analysis{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.clock{width:148px;min-width:148px;justify-content:stretch}.clock #clock{display:grid;flex:1;min-width:0;place-items:center;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}.clock #reset{display:grid;place-items:center;flex:0 0 30px;min-width:30px;padding:0;font-size:0;color:var(--muted)}.clock #reset:before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-1px,-1px)}
</style>
</head>
<body>
<header class="top">
  <div class="toolbar" data-pixelpatch-region="toolbar">
    <div class="brand">Trajectory <i>/</i> 联动执行图谱</div><span class="spacer"></span>
    <div class="controls">
      <button id="play" class="play">播放</button>
      <select id="speed" class="speed" aria-label="播放速度"><option selected>1×</option><option>5×</option><option>25×</option><option>100×</option><option>500×</option></select>
      <div class="control-group" aria-label="缩放控制"><button id="zoomOut" aria-label="缩小">−</button><output id="zoomValue">100%</output><button id="zoomIn" aria-label="放大">＋</button></div>
      <div class="control-group clock"><span id="clock">0:00 / 0:00</span><button id="reset" aria-label="恢复完整时间轴"></button></div>
      <input id="timeline" class="sr-range" type="range" min="0" max="1" value="0" aria-label="检查游标">
      <div class="search-wrap"><input id="search" class="search" placeholder="搜索工具调用、节点或备注…"></div>
      <label class="toolbar-filter"><input id="onlyFail" type="checkbox"><span>只看失败 / 重试</span></label>
      <select id="category" class="toolbar-category" aria-label="工具筛选"><option value="">全部工具</option></select>
    </div>
  </div>
  <div class="meta" data-pixelpatch-region="session-meta">
    <span>会话：<b id="sessionName">—</b></span><span>开始时间：<b id="startedAt">—</b></span><span>总时长：<b id="durationMeta">—</b></span><span id="status" class="badge badge-complete">正在连接</span><span class="badge badge-answer">最终回答</span><span>模型：<b id="modelMeta">—</b></span><span>总 Token：<b id="tokenMeta">—</b></span><span>峰值上下文：<b id="peakMeta">—</b></span>
  </div>
</header>
<div id="empty" class="empty">等待当前任务的可视化数据…</div>
<main id="screen" class="shell" hidden>
  <section class="atlas-wrap" data-pixelpatch-region="atlas"><svg id="atlas" role="img" aria-label="执行图谱、工具调用、Token 脉冲和上下文压力"></svg><span class="region-marker" data-pixelpatch-region="execution-lane" style="top:0;height:198px"></span><span class="region-marker" data-pixelpatch-region="tool-lane" style="top:198px;height:126px"></span><span class="region-marker" data-pixelpatch-region="token-lane" style="top:324px;height:117px"></span><span class="region-marker" data-pixelpatch-region="context-lane" style="top:441px;height:117px"></span></section>
  <section id="findings" class="findings" data-pixelpatch-region="findings"></section>
  <section class="bottom">
    <section class="analysis" data-pixelpatch-region="duration"><div class="section-title"><h2>耗时分布（按工具）</h2><div class="control-group" aria-label="耗时分布缩放"><button id="beeswarmZoomOut" type="button" aria-label="缩小耗时分布" disabled>−</button><output id="beeswarmZoomValue">100%</output><button id="beeswarmZoomIn" type="button" aria-label="放大耗时分布">＋</button></div></div><div id="beeswarm"></div></section>
    <section class="analysis" data-pixelpatch-region="result-matrix"><h2>工具结果矩阵</h2><div id="matrix" class="matrix"></div></section>
  </section>
  <section class="below"><section id="failPanel" class="section" hidden><div class="section-title"><h2>失败重试链</h2><button id="failToggle" class="failure-toggle" type="button" hidden aria-expanded="false"></button></div><div id="failList"></div></section><section id="agentPanel" class="section" hidden data-pixelpatch-region="agent-graph"><div class="section-title"><h2>Agent 关系图谱 <small>节点大小 = Token · 线宽随调用数变化</small></h2><div class="control-group" aria-label="Agent 关系图谱缩放"><button id="agentZoomOut" type="button" aria-label="缩小 Agent 关系图谱" disabled>−</button><output id="agentZoomValue">100%</output><button id="agentZoomIn" type="button" aria-label="放大 Agent 关系图谱">＋</button></div></div><div id="agents"></div></section></section>
</main>
<aside id="detail" class="detail" hidden><header><h3 id="detailTitle"></h3><span id="detailBadge" class="badge"></span><button id="closeDetail">关闭</button></header><p id="detailMeta"></p><b id="detailArgsLabel">参数</b><pre id="detailArgs"></pre><b id="detailResultLabel">返回内容</b><pre id="detailResult"></pre></aside>
<div id="tooltip" class="tooltip" role="tooltip" hidden><b id="tooltipTitle"></b><span id="tooltipBody"></span><small id="tooltipMeta"></small></div>
<script src="v2-runtime.js?v=20260830-wheel"></script>
</body>
</html>
